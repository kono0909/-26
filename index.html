<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Moomin Valley Adventure</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f4f1ea; font-family: 'serif'; }
        canvas { display: block; filter: contrast(1.1) sepia(0.2); }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(244, 241, 234, 0.7); color: #4a4a4a;
        }
        h1 { font-size: 48px; font-weight: normal; border-bottom: 2px solid #4a4a4a; padding-bottom: 10px; }
        button {
            margin-top: 30px; padding: 12px 40px; font-size: 18px; cursor: pointer;
            border: 2px solid #4a4a4a; background: transparent; color: #4a4a4a;
            transition: 0.3s;
        }
        button:hover { background: #4a4a4a; color: #f4f1ea; }
        .ui { position: absolute; top: 30px; left: 30px; font-size: 20px; color: #4a4a4a; border: 1px solid #4a4a4a; padding: 5px 15px; }
    </style>
</head>
<body>
    <div class="ui">記録: <span id="score">0</span> / 50</div>
    <div id="overlay">
        <h1 id="title">谷の散歩道</h1>
        <p id="message">静かな森を通り抜けましょう。</p>
        <button id="startBtn">歩き出す</button>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameActive = false;
let frame = 0;
const gravity = 0.5;

// 手描きの揺らぎを作る関数
function wobble() { return Math.random() * 2 - 1; }

const player = {
    x: 150, y: 0, radius: 25, dy: 0,
    jumpForce: -12, ground: canvas.height - 100,
    jumpCount: 0, maxJumps: 3,
    draw() {
        ctx.save();
        ctx.translate(this.x + wobble(), this.y + wobble());
        
        // 本体（手描きの不完全な円）
        ctx.beginPath();
        for(let i=0; i<Math.PI*2; i+=0.5) {
            let r = this.radius + wobble();
            ctx.lineTo(Math.cos(i)*r, Math.sin(i)*r);
        }
        ctx.closePath();
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.strokeStyle = "#4a4a4a";
        ctx.lineWidth = 2;
        ctx.stroke();

        // 目のような点
        ctx.fillStyle = "#4a4a4a";
        ctx.beginPath();
        ctx.arc(8, -5, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
};

const obstacles = [];
function createObstacle() {
    obstacles.push({
        x: canvas.width + 100,
        width: 40 + Math.random() * 40,
        height: 50 + Math.random() * 80,
        speed: 5 + (score * 0.1),
        type: Math.random() > 0.5 ? 'stone' : 'stump'
    });
}

function drawBackground() {
    // 紙の質感
    ctx.fillStyle = "#f4f1ea";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 遠くの木（シルエット）
    ctx.strokeStyle = "#c0b7a8";
    ctx.lineWidth = 2;
    for(let i=0; i<5; i++) {
        let x = (i * 300 + frame * -0.2) % (canvas.width + 300);
        if (x < -100) x += canvas.width + 300;
        ctx.beginPath();
        ctx.moveTo(x, player.ground);
        ctx.lineTo(x, player.ground - 150);
        ctx.lineTo(x - 20, player.ground - 100);
        ctx.moveTo(x, player.ground - 150);
        ctx.lineTo(x + 20, player.ground - 110);
        ctx.stroke();
    }

    // 地面（一本の線）
    ctx.strokeStyle = "#4a4a4a";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, player.ground + wobble());
    ctx.lineTo(canvas.width, player.ground + wobble());
    ctx.stroke();
}

function update() {
    if (!gameActive) return;
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();

    player.dy += gravity;
    player.y += player.dy;
    if (player.y + player.radius > player.ground) {
        player.y = player.ground - player.radius;
        player.dy = 0;
        player.jumpCount = 0;
    }
    player.draw();

    if (frame % 120 === 0) createObstacle();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= obs.speed;

        // 障害物の描画
        ctx.save();
        ctx.translate(obs.x + wobble(), player.ground + wobble());
        ctx.strokeStyle = "#4a4a4a";
        ctx.fillStyle = obs.type === 'stone' ? "#e0ddd5" : "#d2c3ae";
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        if(obs.type === 'stone') {
            ctx.moveTo(0, 0);
            ctx.lineTo(obs.width*0.2, -obs.height);
            ctx.lineTo(obs.width*0.8, -obs.height*0.9);
            ctx.lineTo(obs.width, 0);
        } else {
            ctx.rect(0, -obs.height, obs.width, obs.height);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // 【判定を厳しく設定】
        // 余裕を持たせず、実際の矩形範囲で厳格に判定
        if (player.x + player.radius > obs.x && 
            player.x - player.radius < obs.x + obs.width && 
            player.y + player.radius > player.ground - obs.height) {
            endGame(false);
        }

        if (!obs.passed && obs.x < player.x) {
            obs.passed = true;
            score++;
            scoreElement.innerText = score;
            if (score >= 50) endGame(true);
        }
        if (obs.x < -100) obstacles.splice(i, 1);
    }
    requestAnimationFrame(update);
}

function jump() {
    if (gameActive && player.jumpCount < player.maxJumps) {
        player.dy = player.jumpForce;
        player.jumpCount++;
    }
}

function endGame(success) {
    gameActive = false;
    overlay.style.display = 'flex';
    document.getElementById('title').innerText = success ? '春が来ました' : 'おやすみなさい';
    document.getElementById('message').innerText = success ? '50の試練を越え、平和な朝を迎えました。' : '少しお休みしましょう。';
    startBtn.innerText = 'もう一度歩く';
}

function startGame() {
    score = 0;
    scoreElement.innerText = score;
    obstacles.length = 0;
    player.y = player.ground - player.radius;
    player.dy = 0;
    player.jumpCount = 0;
    gameActive = true;
    overlay.style.display = 'none';
    update();
}

startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
window.addEventListener('keydown', (e) => { if(e.code === 'Space') jump(); });
window.addEventListener('mousedown', jump);

drawBackground();
player.draw();
</script>
</body>
</html>
